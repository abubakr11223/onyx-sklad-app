services:
  db:
    image: postgres:16-alpine
    container_name: onyx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: onyx
      POSTGRES_PASSWORD: onyx_dev
      POSTGRES_DB: onyx
    ports:
      - "5432:5432"
    volumes:
      - onyx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onyx -d onyx"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  onyx_pgdata:
