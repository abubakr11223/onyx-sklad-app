# CI: тесты + сборка на каждом PR и push в main.
#
# Основная масса тестов БД не требует (vi.mock для @/lib/db, in-memory моки).
# НО с 2026-09-02 в CI поднимается настоящий Postgres — ради одного теста:
# репетиции восстановления из резервной копии. Аудит показал, что она
# пропускалась всегда (без БД `describe.skipIf` её отключал), то есть путь
# «копия → пустая база → сверка по каждой таблице» ни разу не проверялся
# автоматически. Непроверенная резервная копия — это не резервная копия.
# `prisma generate` запускается автоматически через `postinstall` из package.json.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Отменяем предыдущие ран'ы того же PR/бранча — не тратим минут CI на устаревшее.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Репетиция восстановления создаёт свою черновую базу рядом с этой,
    # поэтому пользователю нужны права CREATE DATABASE — postgres подходит.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onyx?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/onyx?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json engines.node = ">=20.9" → берём последнюю LTS (24 сейчас),
      # но фиксируем через .node-version в будущем при желании. Cache npm.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` уважает package-lock.json и запускает postinstall
      # (`prisma generate` — нужен для type-check и import type @prisma/client).
      - name: Install dependencies
        run: npm ci

      # Схема + данные. Без данных репетиция бессмысленна: сверка «0 = 0»
      # проходит для пустой таблицы и ничего не доказывает, поэтому тест
      # теперь падает на любой пустой таблице (см. restore-rehearsal).
      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Run tests
        run: npm test

      # Аудит 2026-08-10 — раньше lint в CI НЕ запускался вовсе, и в main тихо
      # накопилось 8 ошибок (react-hooks/purity, immutability, prefer-const).
      # `eslint .` падает только на ERROR; предупреждения (unused vars в тестах)
      # проходят — чтобы шаг был обязательным, а не «красным всегда».
      - name: Lint
        run: npm run lint

      # `next build` включает typecheck + оптимизацию. Ошибка типов = failed CI.
      - name: Build
        run: npm run build
